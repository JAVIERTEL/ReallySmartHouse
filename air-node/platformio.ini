; ─────────────────────────────────────────────────────────────
; Air Node — ReallySmartHouse
; Board  : ESP32 DevKit V1
; Radio  : RN2483 (LoRa P2P via UART2)
; Sensor : DHT11
; Output : DC motor + HW-482 (fan control)
; ─────────────────────────────────────────────────────────────

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14